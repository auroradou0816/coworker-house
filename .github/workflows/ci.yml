name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  sandbox-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/coworkerhouse_code_agent_runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coworkerhouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coworkerhouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    env:
      ROOM_EVENT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coworkerhouse_test
      BULLMQ_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      # The room-event suite must not silently skip in CI: the service database
      # above supplies the URL used by trigger, transaction, and NOTIFY tests.
      - run: npm test -- --test-concurrency=1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [core, postgres, codex]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coworkerhouse_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d coworkerhouse_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coworkerhouse_e2e
      E2E_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client-heroui/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client-heroui
      - run: npm run migrate:schema --prefix server
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: npx playwright install --with-deps chromium
        working-directory: client-heroui
      - if: matrix.suite == 'core'
        run: >-
          npm run test:e2e --
          multi-client-realtime.spec.ts room-restore.spec.ts
          message-drafts.spec.ts long-conversation.spec.ts
          code-agent-flows.spec.ts code-agent-mobile.mobile.spec.ts mobile-core.mobile.spec.ts
        working-directory: client-heroui
      - if: matrix.suite == 'postgres'
        run: npm run test:e2e:postgres
        working-directory: client-heroui
      - if: matrix.suite == 'codex'
        run: node --test ../server/coworkerhouse_code_agent_runner/tests/personal_browser.test.cjs
        working-directory: client-heroui
        env:
          NODE_PATH: ${{ github.workspace }}/client-heroui/node_modules
      - if: matrix.suite == 'codex'
        run: npm run test:e2e:codex
        working-directory: client-heroui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.suite }}
          path: client-heroui/test-results/
          retention-days: 7

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-heroui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18
          cache: npm
          cache-dependency-path: client-heroui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose validation values
        run: |
          cp .env.compose.example .env.compose
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-not-a-secret/' .env.compose
          sed -i 's/^LOCAL_S3_ACCESS_KEY_ID=.*/LOCAL_S3_ACCESS_KEY_ID=ciaccesskey/' .env.compose
          sed -i 's/^LOCAL_S3_SECRET_ACCESS_KEY=.*/LOCAL_S3_SECRET_ACCESS_KEY=ci-only-not-a-secret/' .env.compose
      - name: Validate private and public Compose profiles
        run: |
          docker compose --env-file .env.compose config --quiet
          docker compose --env-file .env.compose --profile public config --quiet
      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e PUBLIC_DOMAIN=app.example.com
          -e MEDIA_DOMAIN=objects.example.com
          -v "$PWD/ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build production application image
        run: docker build --tag coworker-house:ci .
